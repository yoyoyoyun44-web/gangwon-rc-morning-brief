name: Kakao Token Setup

on:
  workflow_dispatch:
    inputs:
      authorization_code:
        description: "카카오 인증 코드"
        required: true
        type: string

jobs:
  get-token:
    runs-on: ubuntu-latest

    steps:
      - name: Exchange authorization code for tokens
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REDIRECT_URI: https://yoyoyoyun44-web.github.io/gangwon-rc-morning-brief/kakao_callback.html
          AUTHORIZATION_CODE: ${{ inputs.authorization_code }}
          GH_TOKEN: ${{ secrets.GH_SECRET_ADMIN }}
        run: |
          python - <<'PY'
          import os
          import requests
          import subprocess

          data = {
              "grant_type": "authorization_code",
              "client_id": os.environ["KAKAO_REST_API_KEY"],
              "redirect_uri": os.environ["KAKAO_REDIRECT_URI"],
              "code": os.environ["AUTHORIZATION_CODE"],
              "client_secret": os.environ["KAKAO_CLIENT_SECRET"],
          }

          response = requests.post(
              "https://kauth.kakao.com/oauth/token",
              data=data,
              timeout=20,
          )

          print("HTTP status:", response.status_code)

          if not response.ok:
              print("카카오 토큰 발급 실패")
              print(response.text)
              raise SystemExit(1)

          result = response.json()

          refresh_token = result.get("refresh_token")

          if not refresh_token:
              print("Refresh Token이 발급되지 않았습니다.")
              raise SystemExit(1)

          # Refresh Token을 GitHub 로그에 노출되지 않도록 마스킹
          print("::add-mask::" + refresh_token)

          print("토큰 발급 성공")
          print("Access Token: 발급됨")
          print("Refresh Token: 발급됨")
          print("")
          print("Refresh Token을 GitHub Secret에 저장합니다.")

          # GitHub Repository Secret에 자동 저장
          subprocess.run(
              [
                  "gh",
                  "secret",
                  "set",
                  "KAKAO_REFRESH_TOKEN",
                  "--repo",
                  "yoyoyoyun44-web/gangwon-rc-morning-brief",
                  "--body",
                  refresh_token,
              ],
              check=True,
              env=os.environ,
          )

          print("")
          print("✅ KAKAO_REFRESH_TOKEN 저장 성공")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("## 카카오 토큰 설정 결과\n\n")
              f.write("✅ Access Token 발급 성공\n\n")
              f.write("✅ Refresh Token 발급 성공\n\n")
              f.write("✅ GitHub Secret `KAKAO_REFRESH_TOKEN` 저장 성공\n\n")
              f.write("🔐 Refresh Token 값은 화면에 표시하지 않았습니다.\n")
          PY
