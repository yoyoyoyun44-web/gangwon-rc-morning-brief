
name: Morning Brief - Weekdays

on:
  schedule:
    # 08:15 KST = 23:15 UTC on the previous day
    # 일~목 UTC 실행 → 월~금 KST 실행
    - cron: "15 23 * * 0-4"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  morning-brief:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 google-genai holidays

      # =========================================================
      # 한국 영업일 확인
      # 주말 + 법정공휴일이면 이후 작업을 실행하지 않음
      # =========================================================
      - name: Check Korean business day
        id: business_day
        shell: bash
        run: |
          python - <<'PY'
          import os
          import holidays
          from datetime import datetime, timezone, timedelta

          kst = timezone(timedelta(hours=9))
          today = datetime.now(kst).date()

          kr = holidays.KR(years=today.year)
          is_holiday = today in kr
          is_weekend = today.weekday() >= 5
          should_run = not is_holiday and not is_weekend

          print(f"KST date: {today}")
          print(f"Weekday: {not is_weekend}")
          print(f"Holiday: {is_holiday} {kr.get(today, '')}")
          print(f"Business day: {should_run}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"run={'true' if should_run else 'false'}\n")
          PY

      # =========================================================
      # 뉴스 검색
      # =========================================================
      - name: Run news search
        if: steps.business_day.outputs.run == 'true'
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python src/news_search.py

      # =========================================================
      # AI 뉴스 분석
      # =========================================================
      - name: Generate AI news
        if: steps.business_day.outputs.run == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        continue-on-error: true
        run: python src/ai_generate.py

      # =========================================================
      # AI 실패/쿼터 초과 대비 안전장치
      # 뉴스 검색 결과가 있는데 AI 결과가 비어 있으면
      # 원본 뉴스에서 의료비·치료비·간병 관련 기사를 자동 선별해
      # 최소 10건의 브리핑 데이터를 만든다.
      # =========================================================
      - name: Fallback news when AI unavailable
        if: steps.business_day.outputs.run == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path
          from datetime import datetime

          raw_path = Path("data/raw_news.json")
          out_path = Path("data/news.json")

          def load(path, default):
              try:
                  with path.open("r", encoding="utf-8") as f:
                      return json.load(f)
              except Exception:
                  return default

          raw = load(raw_path, [])
          existing = load(out_path, {})
          categories = existing.get("categories", {}) if isinstance(existing, dict) else {}
          existing_count = sum(len(v or []) for v in categories.values()) if isinstance(categories, dict) else 0

          if existing_count > 0:
              print(f"AI 뉴스 정상 생성: {existing_count}건")
              raise SystemExit(0)

          if isinstance(raw, dict):
              for key in ("items", "news", "articles"):
                  if isinstance(raw.get(key), list):
                      raw = raw[key]
                      break
          if not isinstance(raw, list):
              raw = []

          major_domains = {
              "chosun.com", "joongang.co.kr", "donga.com", "hani.co.kr", "hankookilbo.com",
              "mk.co.kr", "hankyung.com", "sedaily.com", "fnnews.com", "newsis.com",
              "yna.co.kr", "news1.kr", "edaily.co.kr", "heraldcorp.com", "asiae.co.kr",
              "mt.co.kr", "seoul.co.kr", "khan.co.kr", "nocutnews.co.kr", "ytn.co.kr"
          }

          excluded = [
              "GA", "법인보험대리점", "보험대리점", "이직", "전환", "채널 경쟁",
              "시장점유율", "주가", "주식", "자동차보험", "여행자보험", "펫보험",
              "휴대폰보험", "실적", "영업이익", "순이익"
          ]
          medical_terms = [
              "의료비", "치료비", "비급여", "본인부담", "선별급여", "고액", "신약",
              "암", "뇌혈관", "심혈관", "심장", "뇌졸중", "중증질환", "간병", "간병비",
              "간병인", "가족 간병", "재활", "수술", "항암"
          ]
          caregiver_terms = ["간병비", "간병인", "간병", "가족 간병", "돌봄 부담"]

          def text(a):
              return " ".join(str(a.get(k, "")) for k in ("title", "description", "source")).strip()

          def score(a):
              t = text(a)
              s = 0
              for term in medical_terms:
                  if term in t:
                      s += 8
              for term in caregiver_terms:
                  if term in t:
                      s += 6
              if any(a.get("source", "") == d or d in str(a.get("source_url", "")) for d in major_domains):
                  s += 12
              if a.get("is_major_news"):
                  s += 10
              if "비급여" in t or "본인부담" in t:
                  s += 8
              return s

          candidates = []
          seen = set()
          for a in raw:
              if not isinstance(a, dict):
                  continue
              title = str(a.get("title", "")).strip()
              url = str(a.get("naver_url") or a.get("source_url") or a.get("url") or "").strip()
              if not title or not url or url in seen:
                  continue
              seen.add(url)
              t = text(a)
              if any(term in t for term in excluded):
                  continue
              sc = score(a)
              if sc <= 0:
                  continue
              candidates.append((sc, a))

          candidates.sort(key=lambda x: x[0], reverse=True)
          selected = [a for _, a in candidates[:10]]

          # 후보가 부족하면 원본 최신 기사에서 보충
          if len(selected) < 10:
              for a in raw:
                  if not isinstance(a, dict):
                      continue
                  title = str(a.get("title", "")).strip()
                  url = str(a.get("naver_url") or a.get("source_url") or a.get("url") or "").strip()
                  if not title or not url or url in {str(x.get("naver_url") or x.get("source_url") or x.get("url") or "") for x in selected}:
                      continue
                  selected.append(a)
                  if len(selected) >= 10:
                      break

          today = datetime.now().strftime("%Y.%m.%d")
          medical = []
          policy = []
          samsung = []
          sales_points = []

          for a in selected:
              t = text(a)
              category = "policy" if any(x in t for x in ["금융위원회", "금융감독원", "보건복지부", "건강보험 제도", "제도 개선", "급여화"]) else "medical"
              if "삼성화재" in t:
                  category = "samsung_fire"

              article = {
                  "title": str(a.get("title", "")).strip(),
                  "summary": str(a.get("description", "")).strip() or "오늘 확인할 보험·의료 관련 주요 뉴스입니다.",
                  "why_it_matters": "고객의 실제 의료비 부담과 현재 보장 공백을 점검할 수 있는 상담 소재입니다.",
                  "sales_tip": "뉴스 내용을 계기로 고객에게 최근 치료비·비급여·본인부담금에 대한 걱정을 물어보고 현재 장기보험 보장을 점검해 보세요.",
                  "source": str(a.get("source", "")).strip(),
                  "published_at": str(a.get("published_at", "")).strip(),
                  "naver_url": str(a.get("naver_url") or a.get("source_url") or a.get("url") or "").strip(),
                  "source_url": str(a.get("source_url") or a.get("url") or "").strip(),
              }

              if category == "policy":
                  policy.append(article)
              elif category == "samsung_fire":
                  samsung.append(article)
              else:
                  medical.append(article)

              if len(sales_points) < 5:
                  if any(x in t for x in ["암", "항암"]):
                      sales_points.append("암 진단 이후 수술·항암·약물치료 등 치료 과정의 비용 부담까지 함께 점검해 보세요.")
                  elif any(x in t for x in ["뇌혈관", "뇌졸중"]):
                      sales_points.append("뇌혈관질환은 진단 이후 시술·수술·재활까지 이어질 수 있는 치료비 부담을 물어보세요.")
                  elif any(x in t for x in ["심혈관", "심장"]):
                      sales_points.append("심혈관질환은 진단뿐 아니라 시술·수술·약물치료 과정의 비용 부담까지 확인해 보세요.")
                  elif any(x in t for x in ["간병", "돌봄"]):
                      sales_points.append("입원했을 때 간병인 비용과 가족의 돌봄 부담을 어떻게 준비하고 있는지 물어보세요.")
                  else:
                      sales_points.append("최근 의료비 부담에 대한 고객의 걱정을 확인하고 현재 장기보험 보장을 점검해 보세요.")

          if not sales_points:
              sales_points = ["오늘 고객 한 명에게 최근 의료비 부담과 현재 건강·장기보험 보장을 함께 점검해 보세요."]

          result = {
              "date": today,
              "categories": {
                  "policy": policy[:2],
                  "medical": medical[:7],
                  "samsung_fire": samsung[:2]
              },
              "sales_points": sales_points[:5],
              "fallback": True
          }

          total = sum(len(v) for v in result["categories"].values())
          if total == 0:
              raise RuntimeError("뉴스 검색 결과가 없어 브리핑을 만들 수 없습니다.")

          with out_path.open("w", encoding="utf-8") as f:
              json.dump(result, f, ensure_ascii=False, indent=2)

          print(f"AI 결과가 없어 fallback 브리핑 생성: {total}건")
          PY

      # =========================================================
      # 카드뉴스 HTML 생성
      # =========================================================
      - name: Generate HTML
        if: steps.business_day.outputs.run == 'true'
        run: python src/generate_html.py

      # =========================================================
      # 생성된 파일 GitHub 저장
      # =========================================================
      - name: Commit generated files
        if: steps.business_day.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/raw_news.json data/news.json docs/index.html

          git diff --cached --quiet || git commit -m "Generate morning brief"

          git push

      # =========================================================
      # 카카오톡 나와의 채팅 전송
      # =========================================================
      - name: Send to KakaoTalk
        if: steps.business_day.outputs.run == 'true'
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
        run: python src/kakao_send.py
