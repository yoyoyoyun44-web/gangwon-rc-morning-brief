name: Morning Brief - Weekdays

on:
  schedule:
    - cron: "15 23 * * 0-4"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  morning-brief:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 google-genai holidays
      - name: Check Korean business day
        id: business_day
        shell: bash
        run: |
          python - <<'PY'
          import os, holidays
          from datetime import datetime, timezone, timedelta
          kst=timezone(timedelta(hours=9)); today=datetime.now(kst).date()
          kr=holidays.KR(years=today.year); run=today.weekday()<5 and today not in kr
          print(f"KST date: {today}"); print(f"Business day: {run}")
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write(f"run={'true' if run else 'false'}\n")
          PY
      - name: Run news search
        if: steps.business_day.outputs.run == 'true'
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python src/news_search.py
      - name: Run official source collection
        if: steps.business_day.outputs.run == 'true'
        run: python src/official_sources.py
      - name: Generate AI news
        if: steps.business_day.outputs.run == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        shell: bash
        run: |
          set +e
          python src/ai_generate.py
          status=$?
          if [ $status -ne 0 ]; then
            python src/ai_fallback.py
          fi
          exit 0
      - name: Verify news output
        if: steps.business_day.outputs.run == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/news.json')
          if not p.exists(): raise SystemExit('data/news.json이 생성되지 않았습니다.')
          count=int(json.loads(p.read_text(encoding='utf-8')).get('article_count',0))
          print(f'Morning Brief 뉴스 결과: {count}개')
          if count<=0: raise SystemExit('Morning Brief 뉴스가 0개입니다.')
          PY
      - name: Generate weather map and clickable detail page
        if: steps.business_day.outputs.run == 'true'
        env:
          KMA_API_KEY: ${{ secrets.KMA_API_KEY }}
        run: python src/weather_overlay.py
      - name: Run Kakao send pipeline
        if: steps.business_day.outputs.run == 'true'
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
        run: python src/kakao_send.py
      - name: Commit generated site data
        if: steps.business_day.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/weather.json docs/index.html
          git diff --cached --quiet || git commit -m "Update daily weather map"
          git push
