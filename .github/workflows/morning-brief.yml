name: Morning Brief - Weekdays

on:
  schedule:
    # 08:15 KST = 23:15 UTC on the previous day
    - cron: "15 23 * * 0-4"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  morning-brief:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 google-genai holidays

      - name: Check Korean business day
        id: business_day
        run: |
          python - <<'PY'
          import holidays
          from datetime import datetime, timezone, timedelta

          kst = timezone(timedelta(hours=9))
          today = datetime.now(kst).date()
          kr = holidays.KR(years=today.year)
          is_holiday = today in kr
          print(f"KST date: {today}")
          print(f"Holiday: {is_holiday} {kr.get(today, '')}")
          with open("$GITHUB_OUTPUT", "a", encoding="utf-8") as f:
              f.write(f"run={'false' if is_holiday else 'true'}\n")
          PY

      - name: Run news search
        if: steps.business_day.outputs.run == 'true'
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python src/news_search.py

      - name: Generate AI news
        if: steps.business_day.outputs.run == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python src/ai_generate.py

      - name: Generate HTML
        if: steps.business_day.outputs.run == 'true'
        run: python src/generate_html.py

      - name: Commit generated files
        if: steps.business_day.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw_news.json data/news.json docs/index.html
          git diff --cached --quiet || git commit -m "Generate morning brief"
          git push

      - name: Send to KakaoTalk
        if: steps.business_day.outputs.run == 'true'
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
        run: python src/kakao_send.py
